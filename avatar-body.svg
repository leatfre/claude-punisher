<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 487" width="600" height="487" role="img" aria-label="Claude Punisher (cuerpo)">
  <title>Claude Punisher (cuerpo, sin ojos ni borde)</title>
  <!-- Variante para el widget de escritorio:
       - SIN los ojos: los dibuja widget.html por encima, para poder animarlos.
         En avatar.svg estan en x 133.56 y 419.77, y 141.15, de 47.7x51.66.
       - SIN el borde blanco de sticker: sobre el escritorio queda mejor la
         silueta limpia. La version fiel al PNG original es avatar.svg. -->
  <defs>
