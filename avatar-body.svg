      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <path id="cp-body" fill="#D97757" filter="url(#cp-shadow)"
        d="M85.85 37.82H515.18V141.15H562.88V244.48H515.18V451.13H467.48V347.81H419.77V451.13H372.07V347.81H228.96V451.13H181.26V347.81H133.56V451.13H85.85V244.48H38.15V141.15H85.85Z"/>
</svg>
